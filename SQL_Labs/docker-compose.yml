# Local PostgreSQL for this project. The credentials below are for local development only.
# 01_schema.sql and 02_seed.sql run automatically the first time the container starts;
# the other scripts are mounted at /sql so you can run them on demand.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: museum
      POSTGRES_PASSWORD: museum_dev_only
      POSTGRES_DB: museum
    ports:
      - "5432:5432"
    volumes:
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./sql:/sql:ro
